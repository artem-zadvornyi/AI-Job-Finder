services:
  bot:
    build: .
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      ENVIRONMENT: production
      PORT: "8000"
      SQLITE_URL: sqlite+aiosqlite:////app/data/job_finder_bot.db

